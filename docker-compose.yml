services:
  postgres:
    image: postgres:16-alpine
    container_name: csdl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: csdl
      POSTGRES_DB: csdl_nang_cao
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  - pgdata:/var/lib/postgresql/data
  - ./sql/postgres:/sql:ro
  - ./data:/data:ro
